# /etc/ssh/sshd_config.d/10-hardening.conf
#
# SSH server hardening drop-in for Debian 12 and Ubuntu 22.04 / 24.04.
# Runbook: 12-Linux-Server-Hardening/README.md (step 3)
#
# Why a drop-in file: the main /etc/ssh/sshd_config starts with
#   Include /etc/ssh/sshd_config.d/*.conf
# and sshd keeps the FIRST value it reads for each keyword. Files are read in
# alphabetical order, so "10-" wins over a cloud image's "50-cloud-init.conf"
# that may contain "PasswordAuthentication yes".
#
# BEFORE you reload sshd:
#   1. your public key works:   ssh -i ~/.ssh/id_ed25519 <user>@<server>
#   2. the syntax is valid:     sudo sshd -t
#   3. keep your current session open until a NEW session succeeds.
#
# Replace <admin-user> below. Everything else can stay as is.

# --- Authentication: keys only ------------------------------------------
PubkeyAuthentication yes
PasswordAuthentication no
# Keyboard-interactive is another way to ask for a password (PAM): close it too.
# (Called ChallengeResponseAuthentication before OpenSSH 8.7.)
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# --- Root -------------------------------------------------------------------
# Administrators log in with their own account and use sudo: every action
# is traced to a person, and "root" is not a known username to guess.
PermitRootLogin no

# --- Who may log in ---------------------------------------------------------
# Only the listed accounts can open an SSH session, even if another
# account has a valid key. Separate several names with spaces.
AllowUsers <admin-user>

# --- Slow down guessing and idle sessions ---------------------------------
MaxAuthTries 3
LoginGraceTime 30
# Close a dead session after about 3 x 300 s without an answer from the client.
ClientAliveInterval 300
ClientAliveCountMax 3

# --- Features a server does not need ------------------------------------
X11Forwarding no
# Set to "yes" only if you use ssh -L tunnels on purpose (for example to
# reach a service bound to 127.0.0.1, see DOCKER-PORT-BINDING.md).
AllowTcpForwarding no
AllowAgentForwarding no
