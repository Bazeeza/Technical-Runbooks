name: PowerShell

on:
  push:
    branches: [main]
    paths: ["**/*.ps1", "PSScriptAnalyzerSettings.psd1", ".github/workflows/powershell.yml"]
  pull_request:
    paths: ["**/*.ps1", "PSScriptAnalyzerSettings.psd1", ".github/workflows/powershell.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String -Width 200
          if ($results) {
              Write-Error "$(@($results).Count) PSScriptAnalyzer finding(s)"
              exit 1
          }

  windows-powershell-51:
    # The scripts target technicians' workstations, where Windows PowerShell 5.1
    # is the default shell: make sure every script still parses there
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          $failed = 0
          Get-ChildItem -Path . -Recurse -Filter *.ps1 | ForEach-Object {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                  $errors | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" }
                  $failed++
              }
              else { Write-Host "OK  $($_.Name)" }
          }
          exit $failed
