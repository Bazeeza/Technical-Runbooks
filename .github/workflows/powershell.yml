name: PowerShell

on:
  push:
    branches: [main]
    paths: ["**/*.ps1", "PSScriptAnalyzerSettings.psd1", ".github/workflows/powershell.yml"]
  pull_request:
    paths: ["**/*.ps1", "PSScriptAnalyzerSettings.psd1", ".github/workflows/powershell.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String -Width 200
          if ($results) {
              Write-Error "$(@($results).Count) PSScriptAnalyzer finding(s)"
              exit 1
          }

  windows-powershell-51:
    # The scripts target technicians' workstations, where Windows PowerShell 5.1
    # is the default shell: make sure every script still parses there
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse every script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          $failed = 0
          Get-ChildItem -Path . -Recurse -Filter *.ps1 | ForEach-Object {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                  $errors | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" }
                  $failed++
              }
              else { Write-Host "OK  $($_.Name)" }
          }
          exit $failed

  pester:
    # Unit tests of the repository scripts, in both shells a technician may use
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: pwsh
          - os: windows-latest
            shell: powershell
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Pester 5
        run: |
          # Windows PowerShell 5.1 ships Pester 3.4, which cannot run Pester 5 tests
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.5.0' })) {
              Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Run Pester tests
        run: |
          $PSVersionTable.PSVersion
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = './scripts/tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
