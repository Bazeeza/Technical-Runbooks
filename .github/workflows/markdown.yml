name: Markdown

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".markdownlint-cli2.jsonc", ".github/workflows/markdown.yml", "scripts/Test-ReadmePair.ps1"]
  pull_request:
    paths: ["**/*.md", ".markdownlint-cli2.jsonc", ".github/workflows/markdown.yml", "scripts/Test-ReadmePair.ps1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Rules and ignored folders are listed in .markdownlint-cli2.jsonc
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # --offline: only relative links between files of the repository are checked,
      # so vendor documentation sites cannot make the build flaky
      - name: Check relative links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress "./**/*.md"
          fail: true

  language-pairs:
    # Rules of docs/STYLE.md: each translated document has its twin and its
    # language buttons, and every relative link points to an existing file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check language pairs and relative links
        shell: pwsh
        run: |
          $problems = @(./scripts/Test-ReadmePair.ps1 -Path . -Verbose)
          $problems | Format-Table -AutoSize -Wrap File, Rule, Detail | Out-String -Width 200
          if ($problems.Count -gt 0) {
              Write-Error "$($problems.Count) problem(s) found by Test-ReadmePair.ps1"
              exit 1
          }
