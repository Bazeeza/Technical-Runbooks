! =====================================================================
! Secure baseline for a Cisco Catalyst access switch (IOS 15.x)
! Runbook 11 - Bazeeza/Technical-Runbooks
!
! Before pasting:
!   1. Replace every <PLACEHOLDER> (secrets, hostname).
!   2. Adapt interface names to the model (Gi1/0/x here: 24 ports
!      + 4 uplinks). Check with: show interfaces status
!   3. Example addresses use 192.168.99.0/24 for management.
!      Replace them with the site's addressing plan.
!   4. Paste from the CONSOLE, not over SSH: the management
!      settings below change how you connect.
!
! VLAN plan used in this file:
!   10  USERS      data for workstations
!   20  VOICE      IP phones (voice VLAN)
!   99  MGMT       switch management only
!   998 NATIVE     unused native VLAN for trunks (no hosts)
!   999 BLACKHOLE  parking VLAN for unused ports (no hosts)
! =====================================================================

! ---------- 1. Identity -------------------------------------------------
hostname <SW-ACCESS-01>
ip domain-name example.com
no ip domain-lookup
service timestamps debug datetime msec localtime
service timestamps log datetime msec localtime
service password-encryption

! ---------- 2. Local accounts -------------------------------------------
! Type 9 (scrypt) hashes need IOS 15.3(3) or later.
! On older IOS and in Packet Tracer use: enable secret <ENABLE-SECRET>
enable algorithm-type scrypt secret <ENABLE-SECRET>
username <ADMIN-USER> privilege 15 algorithm-type scrypt secret <ADMIN-SECRET>

! ---------- 3. Login banner ---------------------------------------------
! No hostname, site or company name: the banner is shown before login.
banner motd ^
*****************************************************************
  AUTHORIZED ACCESS ONLY.
  This device is private property. All activity is logged and
  may be monitored. Disconnect now if you are not authorized.
*****************************************************************
^

! ---------- 4. Login protection -----------------------------------------
! Block new logins for 120 s after 3 failures within 60 s.
login block-for 120 attempts 3 within 60
login on-failure log
login on-success log

! ---------- 5. VLANs ----------------------------------------------------
vlan 10
 name USERS
vlan 20
 name VOICE
vlan 99
 name MGMT
vlan 998
 name NATIVE
vlan 999
 name BLACKHOLE

! ---------- 6. Management interface -------------------------------------
interface Vlan1
 description Not used - default VLAN
 no ip address
 shutdown
interface Vlan99
 description Management
 ip address 192.168.99.11 255.255.255.0
 no shutdown
ip default-gateway 192.168.99.1

! Only the management subnet may open SSH sessions.
ip access-list standard MGMT-SSH
 permit 192.168.99.0 0.0.0.255
 deny any log

! ---------- 7. SSH version 2 only ---------------------------------------
! The RSA key needs the hostname and domain name above.
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3

! ---------- 8. Console and remote lines ---------------------------------
line con 0
 login local
 exec-timeout 10 0
 logging synchronous
line vty 0 15
 login local
 transport input ssh
 access-class MGMT-SSH in
 exec-timeout 10 0
 logging synchronous

! ---------- 9. Unused services ------------------------------------------
no ip http server
no ip http secure-server

! ---------- 10. Spanning tree -------------------------------------------
spanning-tree mode rapid-pvst
spanning-tree extend system-id

! ---------- 11. User ports: PC + IP phone -------------------------------
interface range GigabitEthernet1/0/1 - 20
 description User port - PC and IP phone
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 20
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 3
 switchport port-security violation restrict
 switchport port-security aging time 10
 switchport port-security aging type inactivity
 no shutdown

! ---------- 12. Unused ports: black hole VLAN, shut down ----------------
interface range GigabitEthernet1/0/21 - 24 , GigabitEthernet1/0/26 - 28
 description UNUSED - parked in VLAN 999
 switchport mode access
 switchport access vlan 999
 switchport nonegotiate
 shutdown

! ---------- 13. Uplink to distribution: 802.1Q trunk --------------------
! On models that also support ISL (3560, 3750) add first:
!  switchport trunk encapsulation dot1q
interface GigabitEthernet1/0/25
 description UPLINK to distribution
 switchport mode trunk
 switchport trunk native vlan 998
 switchport trunk allowed vlan 10,20,99
 switchport nonegotiate
 no shutdown

! ---------- 14. Time and logs -------------------------------------------
ntp server 192.168.99.1
logging buffered 16384 informational
logging host 192.168.99.20
logging trap informational

end
! Save only after testing a new SSH session from the management VLAN:
! copy running-config startup-config
